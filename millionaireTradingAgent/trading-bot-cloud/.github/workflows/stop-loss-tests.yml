name: Stop-Loss Test Suite

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  test-stop-loss:
    name: Stop-Loss Protection Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Stop-Loss Test Suite
        run: npm run test:ci
        
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/**/*.test.js
            test-output.log
          retention-days: 30
          
  test-stop-loss-required:
    name: Block Deploy on Test Failure
    runs-on: ubuntu-latest
    needs: test-stop-loss
    if: always()
    
    steps:
      - name: Check test status
        run: |
          if [ "${{ needs.test-stop-loss.result }}" != "success" ]; then
            echo "❌ CRITICAL: Stop-loss tests failed"
            echo "Stop-loss protection may be compromised"
            echo "Deployment BLOCKED until tests pass"
            exit 1
          else
            echo "✅ All stop-loss tests passed"
            echo "Safe to proceed with deployment"
          fi
